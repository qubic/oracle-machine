services:

# Oracle Machine Node
  oracle-machine-node:
    image: oracle-machine:latest
    container_name: oracle-machine-node
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    ports:
      - 31841:31841 # Port connection between node and oracle machine, this need to match with port define in config.yml
    restart: unless-stopped
    command: ["oracle_machine_node", "--log","/opt/qubic/oracle-machine/logs/oracle_machine_node.log"]
    networks:
      - oracle-net

# Price Oracle service
  price-oracle-service:
    image: oracle-machine:latest
    container_name: price-oracle-service
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    ports: # Port connection oracle machine and oracle service, this need to match with port define in config.yml
      - 31842:31842
      - 31843:31843
    restart: unless-stopped
    command: ["price_oracle_service", "--log","/opt/qubic/oracle-machine/logs/price_service.log"]
    networks:
      - oracle-net

# Network config
networks:
  oracle-net:
    driver: bridge