services:

# Oracle Machine Node
  oracle-machine-node:
    image: oracle-machine:latest
    container_name: oracle-machine-node
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    ports:
      - 31841:31841 # Port connection between node and oracle machine, this need to match with port define in config.yml
    restart: unless-stopped
    command: ["oracle_machine_node", "--log","/opt/qubic/oracle-machine/logs/oracle_machine_node.log"]
    networks:
      - oracle-net

# Price Oracle service
  price-oracle-service:
    image: oracle-machine:latest
    container_name: price-oracle-service
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    ports: # Port connection oracle machine and oracle service, this need to match with port define in config.yml
      - 31842:31842
      - 31843:31843
    restart: unless-stopped
    command: ["price_oracle_service", "--log","/opt/qubic/oracle-machine/logs/price_service.log"]
    networks:
      - oracle-net

# Read EVM Log Oracle service
  read-evm-log-service:
    image: oracle-machine:latest
    container_name: read-evm-log-service
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    # No published ports: the OM node reaches this service via the oracle-net service name.
    restart: unless-stopped
    command: ["read_evm_log_service", "--log","/opt/qubic/oracle-machine/logs/read_evm_log_service.log"]
    networks:
      - oracle-net

# Read Qubic Log Oracle service
  read-qubic-log-service:
    image: oracle-machine:latest
    container_name: read-qubic-log-service
    volumes:
      - ./logs:/opt/qubic/oracle-machine/logs
    env_file:
      - docker_local.env
    user: "${HOST_UID}:${HOST_GID}"
    # No published ports: the OM node reaches this service via the oracle-net service name.
    # host-gateway makes the operator's own bob on the host reachable as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["read_qubic_log_service", "--log","/opt/qubic/oracle-machine/logs/read_qubic_log_service.log"]
    networks:
      - oracle-net

# Network config
networks:
  oracle-net:
    driver: bridge